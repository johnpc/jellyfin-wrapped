# Web server settings for Jellyfin Wrapped. Included from httpd.conf.
# docker-entrypoint.sh writes env.js, csp.conf and proxy.conf into GENERATED at start.

# --- Identity ---------------------------------------------------------------
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag MTime Size

# Runtime files (pid, mutexes, scoreboard) go to the generated directory, so the rest of
# the image can be read-only. PidFile has its own default and must be set separately.
DefaultRuntimeDir /usr/local/apache2/generated
PidFile /usr/local/apache2/generated/httpd.pid

# --- Limits against slow and oversized requests ------------------------------
Timeout 30
KeepAlive On
KeepAliveTimeout 5
MaxKeepAliveRequests 100
RequestReadTimeout header=10-20,MinRate=500 body=20,MinRate=500
LimitRequestLine 2048
LimitRequestFields 50
LimitRequestFieldSize 4096
# Nothing here accepts a large upload; the API proxy sets its own limit too.
LimitRequestBody 65536

<IfModule mpm_event_module>
    StartServers 1
    ServerLimit 4
    ThreadsPerChild 25
    MaxRequestWorkers 100
    MinSpareThreads 10
    MaxSpareThreads 25
    MaxConnectionsPerChild 10000
</IfModule>

# --- Response headers --------------------------------------------------------
<IfModule headers_module>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set X-Permitted-Cross-Domain-Policies "none"
    Header always unset X-Powered-By
    # Stops a request header named Proxy from reaching the backend (httpoxy).
    RequestHeader unset Proxy early
    # Written by the entrypoint: limits scripts, images and connections to this site and Jellyfin.
    IncludeOptional /usr/local/apache2/generated/csp.conf
</IfModule>

# --- Static site -------------------------------------------------------------
<Directory "/usr/local/apache2/htdocs">
    Options None
    AllowOverride None
    # Only reading is allowed. Anything else (POST, PUT, DELETE, OPTIONS) is refused.
    Require method GET HEAD
    # Single-page app: client-side routes such as /movies are not files, so serve
    # index.html for them. A reload or a direct link then does not return 404.
    FallbackResource /index.html
</Directory>

# Built files have hashed names, so they can be cached for good. A missing one must be a
# real 404, not index.html cached as a script.
<Directory "/usr/local/apache2/htdocs/assets">
    FallbackResource disabled
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>

<Files "index.html">
    Header set Cache-Control "no-cache"
</Files>

# Dotfiles and source maps are never served.
<LocationMatch "/\.|\.map$">
    Require all denied
</LocationMatch>

# --- Runtime settings for the app ----------------------------------------------
Alias /env.js /usr/local/apache2/generated/env.js
<Directory "/usr/local/apache2/generated">
    Options None
    AllowOverride None
    Require method GET HEAD
</Directory>
<Location "/env.js">
    Header always set Cache-Control "no-store"
</Location>

# Load env.js before the app starts. It is a separate file, so the page needs no inline
# script and the Content-Security-Policy can forbid them.
AddOutputFilterByType SUBSTITUTE text/html
<Location "/">
    Substitute "s|<head>|<head><script src=\"/env.js\"></script>|ni"
</Location>

# --- Server mode: forward /api/ to the backend ---------------------------------
# Empty unless WRAPPED_SERVER_URL is set.
ProxyRequests Off
IncludeOptional /usr/local/apache2/generated/proxy.conf
