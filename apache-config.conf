# Do not advertise the server version, and refuse TRACE.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<IfModule headers_module>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
</IfModule>

# Enable output filtering
AddOutputFilterByType SUBSTITUTE text/html

# Define environment variable substitution
<Location />
    # Direct mode: the admin API key is handed to the browser.
    <If "-n env('JELLYFIN_SERVER_URL') && -n env('JELLYFIN_API_KEY')">
        Substitute "s|<head>|<head><script>window.ENV = { JELLYFIN_SERVER_URL: '${JELLYFIN_SERVER_URL}', JELLYFIN_API_KEY: '${JELLYFIN_API_KEY}' };</script>|ni"
    </If>
    # Server mode: no key in the browser, only the Jellyfin URL.
    <ElseIf "-n env('JELLYFIN_SERVER_URL') && -z env('JELLYFIN_API_KEY')">
        Substitute "s|<head>|<head><script>window.ENV = { JELLYFIN_SERVER_URL: '${JELLYFIN_SERVER_URL}' };</script>|ni"
    </ElseIf>
</Location>

# Written at container start by docker-entrypoint.sh when WRAPPED_SERVER_URL is set.
IncludeOptional conf/extra/wrapped-proxy.conf

# Single-page app: client-side routes such as /movies are not files. Serve index.html
# for them, so a reload or a direct link does not return 404.
<Directory "/usr/local/apache2/htdocs">
    FallbackResource /index.html
</Directory>
